spring:
  application:
    name: account-management-service

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

app:
  route:
    prefix: /api
    registration: /authentication/register
    login: /authentication/login

encryption:
  hashing:
    iterations: 10
    memLimit: 60000
    hashLength: 32
    parallelism: 1
    saltLength: 16

  email-token:
    duration: 300

logging:
  level:
    root: INFO
    cpt.api.account_management_service: INFO
    org.springframework.web: INFO