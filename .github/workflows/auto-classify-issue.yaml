name: Auto Set Issue Type and Label

on:
  issues:
    types: [opened]

permissions:
  issues: write
  repository-projects: write

jobs:
  triage-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Set Issue Type to Task and Add Label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          # Fetch the current Issue Type safely
          CURRENT_TYPE=$(gh api repos/$REPO/issues/$ISSUE_NUMBER --jq '.type.name // "none"')
          echo "Detected current issue type: $CURRENT_TYPE"

          # Condition check
          if [ "$CURRENT_TYPE" = "none" ]; then
            echo "Issue has no existing type. Applying defaults..."
            
            # Updates both native Type and attaches your custom label
            gh issue edit "$ISSUE_URL" \
              --type "Task" \
              --add-label "phase 1"
          else
            echo "Skipping update: Issue already has an assigned type ($CURRENT_TYPE)."
          fi

      - name: Add to Project and set field
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/orgs/cloud-price-tracker/projects/2
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
